name: Build Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Android64
          os: ubuntu-latest
          target: Android64
        - name: Android32
          os: ubuntu-latest
          target: Android32

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Port Popup API
        run: |
          find src -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 sed -i -E \
            -e 's/geode::Popup<>\*/geode::Popup*/g' \
            -e 's/geode::Popup<>/PopupCompat<>/g' \
            -e 's/geode::Popup</PopupCompat</g' \
            -e 's/\bPopup<>\*/Popup*/g' \
            -e 's/\bPopup<>/PopupCompat<>/g' \
            -e 's/(get|set)SettingValue<std::filesystem::path>/\1SettingValue<asp::fs::Path>/g'

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: 'TheSillyDoggo/bindings'
          build-config: 'Release'
          combine: true
          sdk: 'v6.0.0-alpha.1'
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
